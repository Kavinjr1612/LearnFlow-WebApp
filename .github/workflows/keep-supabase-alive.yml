name: Keep Supabase Alive
on:
  schedule:
    # Runs at 12:00 UTC every day to ensure it never hits the 7-day inactivity pause
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent inactivity pause
        run: |
          curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
